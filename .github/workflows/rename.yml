name: Rename to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git config user.name "abdelhmid2"
          git config user.email "abdelhmid2@users.noreply.github.com"
          git mv mtjr-rwy.html index.html
          git commit -m "Rename mtjr-rwy.html to index.html"
          git push
